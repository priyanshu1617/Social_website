{% extends "base.html" %}

{% block title %}Logged out{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align:center">
    <h1>You've been logged out</h1>
    <p class="subtitle">Thanks for using Bookmarks. See you next time!</p>
    <a href="{% url 'login' %}" class="button" style="width:100%;display:flex;justify-content:center;margin-top:1rem">
      Sign in again →
    </a>
  </div>
</div>
{% endblock %}
