{% extends "base.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
<div class="simple-form-card">
  <h1>Change password</h1>
  <p>Use the form below to update your password.</p>
  <form method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <input type="submit" value="Change password">
  </form>
</div>
{% endblock %}
