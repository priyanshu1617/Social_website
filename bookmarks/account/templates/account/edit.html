{% extends "base.html" %}

{% block title %}Edit your account{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit profile</h1>
</div>

<div class="edit-layout">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="edit-pane">
      <h2>Account info</h2>
      {{ user_form.as_p }}
    </div>

    <div class="edit-pane">
      <h2>Profile details</h2>
      {{ profile_form.as_p }}
      <input type="submit" value="Save changes" style="width:100%;margin-top:0.75rem">
    </div>

  </form>
</div>
{% endblock %}
